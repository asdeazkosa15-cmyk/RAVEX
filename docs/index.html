<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RAVEX | Gaming & Apps</title>

<meta name="description"
content="RAVEX - منصة الألعاب والبرامج والتطبيقات والتصميم.">

<style>
:root{
  --bg:#070711;
  --bg2:#0d0d1c;
  --card:#121225;
  --card2:#18182e;
  --text:#ffffff;
  --muted:#a7a7c2;
  --purple:#8b5cf6;
  --purple2:#6d28d9;
  --cyan:#22d3ee;
  --blue:#3b82f6;
  --gold:#f5c542;
  --green:#22c55e;
  --red:#ef4444;
  --border:rgba(255,255,255,.09);
  --shadow:0 15px 50px rgba(0,0,0,.45);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:
    Arial,
    Tahoma,
    sans-serif;
  background:
    radial-gradient(
      circle at 20% 10%,
      rgba(124,58,237,.14),
      transparent 30%
    ),
    radial-gradient(
      circle at 80% 30%,
      rgba(34,211,238,.08),
      transparent 30%
    ),
    var(--bg);
  color:var(--text);
  min-height:100vh;
  overflow-x:hidden;
}

a{
  color:inherit;
  text-decoration:none;
}

button,
input,
textarea,
select{
  font-family:inherit;
}

button{
  cursor:pointer;
}

/* =========================
   TOP COLOR BAR
========================= */

.color-bar{
  height:4px;
  width:100%;
  background:
    linear-gradient(
      90deg,
      #7c3aed,
      #2563eb,
      #06b6d4,
      #7c3aed,
      #ec4899,
      #7c3aed
    );
  background-size:300% 100%;
  animation:colorMove 7s linear infinite;
}

@keyframes colorMove{
  0%{
    background-position:0% 50%;
  }

  100%{
    background-position:300% 50%;
  }
}

/* =========================
   TICKER
========================= */

.ticker{
  height:40px;
  background:
    linear-gradient(
      90deg,
      #0b0b17,
      #15112b,
      #0b0b17
    );
  border-bottom:1px solid var(--border);
  overflow:hidden;
  display:flex;
  align-items:center;
  position:relative;
}

.ticker-track{
  display:flex;
  width:max-content;
  gap:70px;
  animation:tickerMove 30s linear infinite;
  white-space:nowrap;
}

.ticker-item{
  color:#ddd;
  font-size:13px;
  display:flex;
  align-items:center;
  gap:9px;
}

.ticker-item b{
  color:var(--cyan);
}

.ticker-dot{
  width:6px;
  height:6px;
  background:var(--purple);
  border-radius:50%;
  box-shadow:
    0 0 12px var(--purple);
}

@keyframes tickerMove{
  from{
    transform:translateX(0);
  }

  to{
    transform:translateX(50%);
  }
}

/* =========================
   HEADER
========================= */

header{
  position:sticky;
  top:0;
  z-index:1000;
  backdrop-filter:blur(18px);
  background:rgba(7,7,17,.86);
  border-bottom:1px solid var(--border);
}

.navbar{
  width:min(1400px,94%);
  margin:auto;
  min-height:76px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:25px;
}

.logo{
  display:flex;
  align-items:center;
  gap:12px;
  font-size:27px;
  font-weight:900;
  letter-spacing:2px;
}

.logo-mark{
  width:45px;
  height:45px;
  border-radius:13px;
  display:grid;
  place-items:center;
  background:
    linear-gradient(
      135deg,
      var(--purple),
      var(--blue)
    );
  box-shadow:
    0 0 25px rgba(139,92,246,.45);
}

.logo-mark span{
  font-size:23px;
}

.logo-text{
  background:
    linear-gradient(
      90deg,
      #fff,
      #a78bfa,
      #67e8f9
    );
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.nav-links{
  display:flex;
  align-items:center;
  gap:6px;
  flex-wrap:wrap;
  justify-content:center;
}

.nav-links a{
  color:#c7c7dc;
  padding:10px 13px;
  border-radius:10px;
  font-size:14px;
  transition:.25s;
}

.nav-links a:hover{
  color:#fff;
  background:rgba(139,92,246,.13);
}

.nav-actions{
  display:flex;
  align-items:center;
  gap:10px;
}

.nav-btn{
  border:1px solid var(--border);
  background:#111124;
  color:white;
  width:42px;
  height:42px;
  border-radius:12px;
  transition:.25s;
}

.nav-btn:hover{
  border-color:var(--purple);
  transform:translateY(-2px);
}

/* =========================
   HERO
========================= */

.hero{
  position:relative;
  min-height:650px;
  display:flex;
  align-items:center;
  overflow:hidden;
  background:
    linear-gradient(
      90deg,
      rgba(7,7,17,.98) 0%,
      rgba(7,7,17,.82) 42%,
      rgba(7,7,17,.38) 100%
    ),
    url("https://cdn.cloudflare.steamstatic.com/steam/apps/1174180/page_bg_generated.jpg")
    center/cover;
}

.hero::before{
  content:"";
  position:absolute;
  inset:0;
  background:
    radial-gradient(
      circle at 75% 45%,
      rgba(124,58,237,.25),
      transparent 35%
    );
  pointer-events:none;
}

.hero-content{
  position:relative;
  z-index:2;
  width:min(1400px,94%);
  margin:auto;
  padding:90px 0;
}

.hero-badge{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:8px 14px;
  border:1px solid rgba(139,92,246,.4);
  border-radius:999px;
  background:rgba(139,92,246,.1);
  color:#c4b5fd;
  font-size:13px;
  margin-bottom:20px;
}

.hero h1{
  max-width:850px;
  font-size:
    clamp(45px,7vw,86px);
  line-height:.98;
  font-weight:1000;
  letter-spacing:-3px;
  margin-bottom:25px;
}

.hero h1 span{
  background:
    linear-gradient(
      90deg,
      #a78bfa,
      #22d3ee,
      #60a5fa
    );
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.hero p{
  max-width:680px;
  color:#c1c1d4;
  font-size:18px;
  line-height:1.9;
  margin-bottom:30px;
}

.hero-buttons{
  display:flex;
  flex-wrap:wrap;
  gap:13px;
}

.btn{
  border:0;
  border-radius:13px;
  padding:14px 23px;
  font-weight:800;
  transition:.25s;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
}

.btn:hover{
  transform:translateY(-3px);
}

.btn-primary{
  color:#fff;
  background:
    linear-gradient(
      135deg,
      var(--purple),
      var(--blue)
    );
  box-shadow:
    0 12px 30px rgba(99,102,241,.28);
}

.btn-secondary{
  color:#fff;
  background:rgba(255,255,255,.06);
  border:1px solid var(--border);
}

.btn-green{
  color:#fff;
  background:
    linear-gradient(
      135deg,
      #16a34a,
      #22c55e
    );
}

.btn-gold{
  color:#111;
  background:
    linear-gradient(
      135deg,
      #facc15,
      #f59e0b
    );
}

.hero-stats{
  display:flex;
  flex-wrap:wrap;
  gap:35px;
  margin-top:50px;
}

.hero-stat strong{
  display:block;
  font-size:25px;
}

.hero-stat span{
  color:var(--muted);
  font-size:13px;
}

/* =========================
   SECTIONS
========================= */

section{
  position:relative;
  padding:85px 0;
}

.container{
  width:min(1400px,94%);
  margin:auto;
}

.section-title{
  display:flex;
  align-items:end;
  justify-content:space-between;
  gap:20px;
  margin-bottom:30px;
}

.section-title h2{
  font-size:34px;
  font-weight:950;
}

.section-title h2 span{
  color:var(--purple);
}

.section-title p{
  color:var(--muted);
  margin-top:8px;
  line-height:1.7;
}

.section-line{
  width:70px;
  height:4px;
  border-radius:10px;
  margin-top:14px;
  background:
    linear-gradient(
      90deg,
      var(--purple),
      var(--cyan)
    );
}

/* =========================
   STATS
========================= */

.stats{
  margin-top:-45px;
  position:relative;
  z-index:5;
}

.stats-grid{
  display:grid;
  grid-template-columns:
    repeat(4,1fr);
  gap:15px;
}

.stat-card{
  background:
    linear-gradient(
      145deg,
      rgba(24,24,46,.95),
      rgba(13,13,28,.95)
    );
  border:1px solid var(--border);
  border-radius:18px;
  padding:25px;
  box-shadow:var(--shadow);
}

.stat-icon{
  font-size:25px;
  margin-bottom:13px;
}

.stat-card strong{
  display:block;
  font-size:28px;
  margin-bottom:6px;
}

.stat-card span{
  color:var(--muted);
  font-size:13px;
}

/* =========================
   GAMES SECTION
========================= */

#games{
  background:
    linear-gradient(
      rgba(7,7,17,.94),
      rgba(7,7,17,.97)
    ),
    url("https://cdn.cloudflare.steamstatic.com/steam/apps/1174180/page_bg_generated.jpg")
    center/cover fixed;
}

.filters{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-bottom:25px;
}

.search-box{
  flex:1;
  min-width:220px;
  position:relative;
}

.search-box input{
  width:100%;
  padding:14px 45px 14px 15px;
  background:#101022;
  border:1px solid var(--border);
  color:#fff;
  outline:none;
  border-radius:12px;
}

.search-box input:focus{
  border-color:var(--purple);
}

.search-icon{
  position:absolute;
  right:15px;
  top:50%;
  transform:translateY(-50%);
  color:var(--muted);
}

.filter-btn{
  border:1px solid var(--border);
  background:#101022;
  color:#c9c9d9;
  padding:0 16px;
  border-radius:12px;
  min-height:46px;
  transition:.2s;
}

.filter-btn:hover,
.filter-btn.active{
  background:
    linear-gradient(
      135deg,
      rgba(139,92,246,.25),
      rgba(37,99,235,.18)
    );
  border-color:rgba(139,92,246,.55);
  color:#fff;
}

.games-grid{
  display:grid;
  grid-template-columns:
    repeat(4,minmax(0,1fr));
  gap:18px;
}

.game-card{
  position:relative;
  overflow:hidden;
  border-radius:17px;
  background:#111122;
  border:1px solid var(--border);
  min-height:365px;
  cursor:pointer;
  transition:
    transform .3s,
    border-color .3s,
    box-shadow .3s;
}

.game-card:hover{
  transform:translateY(-8px);
  border-color:
    rgba(139,92,246,.6);
  box-shadow:
    0 20px 45px rgba(0,0,0,.55),
    0 0 30px rgba(124,58,237,.12);
}

.game-image{
  height:210px;
  position:relative;
  overflow:hidden;
  background:#16162a;
}

.game-image img{
  width:100%;
  height:100%;
  object-fit:cover;
  transition:.5s;
}

.game-card:hover .game-image img{
  transform:scale(1.08);
}

.game-image::after{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(
      transparent 35%,
      rgba(0,0,0,.85)
    );
}

.game-badge{
  position:absolute;
  top:12px;
  right:12px;
  z-index:2;
  padding:6px 9px;
  border-radius:8px;
  background:rgba(0,0,0,.65);
  border:1px solid rgba(255,255,255,.12);
  font-size:11px;
}

.game-rating{
  position:absolute;
  left:12px;
  bottom:12px;
  z-index:2;
  color:#facc15;
  font-size:13px;
}

.game-content{
  padding:17px;
}

.game-content h3{
  font-size:17px;
  margin-bottom:9px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.game-content p{
  color:var(--muted);
  font-size:12px;
  line-height:1.7;
  height:42px;
  overflow:hidden;
}

.game-footer{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  margin-top:15px;
}

.game-type{
  color:#a5b4fc;
  font-size:11px;
}

.details-btn{
  padding:8px 11px;
  border-radius:9px;
  border:1px solid var(--border);
  background:#19192d;
  color:#fff;
  font-size:11px;
}

/* =========================
   WEEKLY
========================= */

#weekly{
  background:
    radial-gradient(
      circle at 15% 20%,
      rgba(139,92,246,.14),
      transparent 35%
    ),
    var(--bg);
}

.weekly-grid{
  display:grid;
  grid-template-columns:
    repeat(3,1fr);
  gap:18px;
}

.weekly-card{
  min-height:250px;
  position:relative;
  overflow:hidden;
  border-radius:18px;
  border:1px solid var(--border);
  background:#111122 center/cover;
}

.weekly-card::before{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(
      transparent 15%,
      rgba(4,4,10,.92)
    );
}

.weekly-content{
  position:absolute;
  inset:auto 20px 20px;
  z-index:2;
}

.weekly-label{
  display:inline-block;
  padding:6px 9px;
  border-radius:7px;
  background:rgba(139,92,246,.25);
  color:#c4b5fd;
  font-size:11px;
  margin-bottom:9px;
}

.weekly-content h3{
  font-size:21px;
  margin-bottom:6px;
}

.weekly-content p{
  color:#bdbdd0;
  font-size:12px;
}/* =========================
   RAVEX DESIGN
========================= */

#design{
  background:
    linear-gradient(
      rgba(7,7,17,.94),
      rgba(7,7,17,.96)
    ),
    url("https://images.unsplash.com/photo-1558655146-d09347e92766?auto=format&fit=crop&w=2000&q=85")
    center/cover fixed;
}

.design-hero{
  position:relative;
  padding:35px;
  margin-bottom:30px;
  border-radius:24px;
  overflow:hidden;
  border:1px solid rgba(139,92,246,.25);
  background:
    linear-gradient(
      120deg,
      rgba(124,58,237,.22),
      rgba(34,211,238,.08),
      rgba(0,0,0,.5)
    );
}

.design-hero::before{
  content:"RAVEX DESIGN";
  position:absolute;
  left:-20px;
  bottom:-55px;
  font-size:100px;
  font-weight:1000;
  color:rgba(255,255,255,.025);
  transform:rotate(-5deg);
  pointer-events:none;
}

.design-hero-content{
  position:relative;
  z-index:2;
  max-width:800px;
}

.design-hero h2{
  font-size:clamp(30px,5vw,55px);
  margin-bottom:12px;
}

.design-hero h2 span{
  background:
    linear-gradient(
      90deg,
      #a78bfa,
      #22d3ee
    );
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.design-hero p{
  color:#c0c0d0;
  line-height:1.9;
}

.design-grid{
  display:grid;
  grid-template-columns:
    repeat(5,minmax(0,1fr));
  gap:15px;
}

.design-card{
  position:relative;
  min-height:245px;
  overflow:hidden;
  border-radius:17px;
  border:1px solid var(--border);
  background:#111122;
  cursor:pointer;
  transition:.3s;
}

.design-card:hover{
  transform:translateY(-7px);
  border-color:
    rgba(34,211,238,.5);
  box-shadow:
    0 18px 40px rgba(0,0,0,.5);
}

.design-card-bg{
  position:absolute;
  inset:0;
  background:
    linear-gradient(
      rgba(7,7,17,.15),
      rgba(7,7,17,.95)
    );
}

.design-card img{
  width:100%;
  height:100%;
  position:absolute;
  inset:0;
  object-fit:cover;
  opacity:.7;
  transition:.4s;
}

.design-card:hover img{
  transform:scale(1.08);
  opacity:.9;
}

.design-info{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  padding:17px;
  z-index:2;
}

.design-icon{
  width:43px;
  height:43px;
  border-radius:11px;
  background:rgba(0,0,0,.55);
  border:1px solid rgba(255,255,255,.15);
  display:grid;
  place-items:center;
  margin-bottom:10px;
  overflow:hidden;
}

.design-icon img{
  position:static;
  width:28px;
  height:28px;
  opacity:1;
  object-fit:contain;
}

.design-info h3{
  font-size:15px;
  margin-bottom:5px;
}

.design-info p{
  color:#aaaabd;
  font-size:11px;
  line-height:1.6;
}

/* =========================
   3D SECTION
========================= */

#threeD{
  background:
    radial-gradient(
      circle at 80% 20%,
      rgba(34,211,238,.1),
      transparent 35%
    ),
    #080812;
}

.three-grid{
  display:grid;
  grid-template-columns:
    repeat(4,minmax(0,1fr));
  gap:18px;
}

.three-card{
  position:relative;
  overflow:hidden;
  min-height:220px;
  border-radius:18px;
  border:1px solid var(--border);
  background:
    linear-gradient(
      145deg,
      #151528,
      #0d0d1b
    );
  cursor:pointer;
  transition:.3s;
}

.three-card:hover{
  transform:translateY(-7px);
  border-color:
    rgba(139,92,246,.55);
}

.three-image{
  height:130px;
  overflow:hidden;
  background:#15152a;
}

.three-image img{
  width:100%;
  height:100%;
  object-fit:cover;
  transition:.4s;
}

.three-card:hover .three-image img{
  transform:scale(1.08);
}

.three-content{
  padding:14px;
}

.three-content h3{
  font-size:15px;
  margin-bottom:6px;
}

.three-content p{
  color:var(--muted);
  font-size:11px;
  line-height:1.6;
}

/* =========================
   MOBILE APPS
========================= */

#mobile{
  background:
    linear-gradient(
      rgba(7,7,17,.95),
      rgba(7,7,17,.97)
    ),
    url("https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?auto=format&fit=crop&w=2000&q=85")
    center/cover fixed;
}

.mobile-grid{
  display:grid;
  grid-template-columns:
    repeat(5,minmax(0,1fr));
  gap:15px;
}

.mobile-card{
  background:
    rgba(17,17,34,.88);
  border:1px solid var(--border);
  border-radius:17px;
  padding:20px;
  text-align:center;
  transition:.3s;
  cursor:pointer;
}

.mobile-card:hover{
  transform:translateY(-7px);
  border-color:
    rgba(34,211,238,.45);
  background:#16162c;
}

.mobile-icon{
  width:65px;
  height:65px;
  border-radius:17px;
  margin:0 auto 14px;
  background:#20203a;
  display:grid;
  place-items:center;
  overflow:hidden;
}

.mobile-icon img{
  width:45px;
  height:45px;
  object-fit:contain;
}

.mobile-card h3{
  font-size:14px;
  margin-bottom:7px;
}

.mobile-card p{
  color:var(--muted);
  font-size:11px;
  line-height:1.6;
}

/* =========================
   WINDOWS
========================= */

#windows{
  background:
    linear-gradient(
      rgba(7,7,17,.94),
      rgba(7,7,17,.97)
    ),
    url("https://images.unsplash.com/photo-1593642532744-d377ab507dc8?auto=format&fit=crop&w=2000&q=85")
    center/cover fixed;
}

.windows-box{
  display:grid;
  grid-template-columns:
    1.2fr .8fr;
  gap:25px;
  align-items:stretch;
}

.windows-main{
  padding:35px;
  min-height:300px;
  border-radius:22px;
  border:1px solid var(--border);
  background:
    linear-gradient(
      135deg,
      rgba(37,99,235,.15),
      rgba(124,58,237,.1)
    );
}

.windows-main h3{
  font-size:30px;
  margin-bottom:15px;
}

.windows-main p{
  color:#bcbcd0;
  line-height:1.9;
  max-width:650px;
}

.windows-features{
  display:grid;
  grid-template-columns:
    repeat(2,1fr);
  gap:12px;
  margin-top:25px;
}

.windows-feature{
  padding:15px;
  border-radius:13px;
  background:rgba(0,0,0,.25);
  border:1px solid var(--border);
}

.windows-feature strong{
  display:block;
  margin-bottom:5px;
}

.windows-feature span{

.support-online{

  height:9px;

  background:#22c55e;
