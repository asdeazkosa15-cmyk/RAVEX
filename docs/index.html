<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مكتبة الألعاب</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: auto;
      background: #1e1e1e;
      padding: 25px;
      border-radius: 10px;
    }

    /* هيدر الصفحة */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 1px solid #333;
      padding-bottom: 15px;
    }

    .lang-btn, .back-btn {
      background-color: #333;
      color: #fff;
      border: 1px solid #555;
      padding: 8px 15px;
      border-radius: 5px;
      cursor: pointer;
    }

    .back-btn {
      background-color: #00adb5;
      color: #fff;
      display: none; /* يظهر فقط عند فتح لعبة */
    }

    /* شبكة قائمة الألعاب */
    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 20px;
    }

    .game-card {
      background: #252525;
      border-radius: 8px;
      padding: 15px;
      text-align: center;
      cursor: pointer;
      transition: transform 0.2s, background 0.2s;
    }

    .game-card:hover {
      transform: translateY(-5px);
      background: #2d2d2d;
    }

    .game-card img {
      width: 100%;
      height: 250px;
      object-fit: cover;
      border-radius: 5px;
    }

    /* صفحة اللعبة المنفردة */
    #game-details {
      display: none;
    }

    .trailer-container {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
      margin: 20px 0;
      border-radius: 8px;
    }

    .trailer-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .btn-mega {
      display: inline-block;
      background-color: #d00000;
      color: white;
      padding: 12px 25px;
      text-decoration: none;
      font-weight: bold;
      border-radius: 5px;
      margin: 15px 0;
    }

    .req-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    .req-table th, .req-table td {
      border: 1px solid #333;
      padding: 10px;
      text-align: start;
    }

    .req-table th {
      background-color: #252525;
      color: #00adb5;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="top-bar">
    <button class="back-btn" id="back-btn" onclick="showCatalog()">← العودة للقائمة</button>
    <button class="lang-btn" id="lang-btn" onclick="toggleLanguage()">English</button>
  </div>

  <!-- قائمة الألعاب (المعرض) -->
  <div id="games-catalog">
    <h1 id="catalog-title">مكتبة الألعاب</h1>
    <div class="games-grid" id="grid-container"></div>
  </div>

  <!-- تفاصيل اللعبة (يتم ملؤها ديناميكياً) -->
  <div id="game-details">
    <h1 id="detail-title"></h1>

    <h2 id="heading-trailer">الإعلان الرسمي (التريلر)</h2>
    <div class="trailer-container">
      <iframe id="detail-trailer" src="" allowfullscreen></iframe>
    </div>

    <h2 id="heading-desc">شرح اللعبة</h2>
    <p id="detail-desc"></p>

    <h2 id="heading-download">رابط التحميل</h2>
    <a id="detail-mega" href="" target="_blank" class="btn-mega">تحميل اللعبة من MEGA</a>

    <h2 id="heading-reqs">متطلبات تشغيل اللعبة</h2>
    <table class="req-table">
      <thead>
        <tr>
          <th id="th-spec">المواصفات</th>
          <th id="th-min">الحد الأدنى</th>
          <th id="th-rec">الموصى به</th>
        </tr>
      </thead>
      <tbody>
        <tr><td id="row-os">نظام التشغيل</td><td id="min-os"></td><td id="rec-os"></td></tr>
        <tr><td id="row-cpu">المعالج</td><td id="min-cpu"></td><td id="rec-cpu"></td></tr>
        <tr><td id="row-ram">الذاكرة (RAM)</td><td id="min-ram"></td><td id="rec-ram"></td></tr>
        <tr><td id="row-gpu">كرت الشاشة</td><td id="min-gpu"></td><td id="rec-gpu"></td></tr>
        <tr><td id="row-storage">المساحة المطلوبة</td><td id="min-storage"></td><td id="rec-storage"></td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
  let currentLang = 'ar';
  let activeGameId = null;

  // قائمة الألعاب - يمكنك إضافة أي عدد من الألعاب هنا بنفس النمط
  const gamesData = [
    {
      id: "game1",
      cover: "https://via.placeholder.com/200x250",
      megaUrl: "https://mega.nz/file/example1",
      youtubeId: "dQw4w9WgXcQ",
      title: { ar: "لعبة 1", en: "Game 1" },
      desc: { 
        ar: "هذا شرح مفصل عن قصة وأسلوب لعب اللعبة الأولى.", 
        en: "This is a detailed overview of Game 1 story and gameplay." 
      },
      reqs: {
        min: { os: "Win 10", cpu: "i5-4460", ram: "8 GB", gpu: "GTX 760", storage: "50 GB" },
        rec: { os: "Win 11", cpu: "i7-3770", ram: "16 GB", gpu: "GTX 1060", storage: "50 GB SSD" }
      }
    },
    {
      id: "game2",
      cover: "https://via.placeholder.com/200x250",
      megaUrl: "https://mega.nz/file/example2",
      youtubeId: "dQw4w9WgXcQ",
      title: { ar: "لعبة 2", en: "Game 2" },
      desc: { 
        ar: "هذا شرح مفصل عن اللعبة الثانية وأبرز مميزاتها.", 
        en: "This is a detailed overview of Game 2 and its features." 
      },
      reqs: {
        min: { os: "Win 10", cpu: "i3-6100", ram: "8 GB", gpu: "GTX 960", storage: "30 GB" },
        rec: { os: "Win 10/11", cpu: "i5-8400", ram: "16 GB", gpu: "GTX 1070", storage: "30 GB SSD" }
      }
    }
  ];

  const UI_TEXT = {
    ar: {
      langBtn: "English", backBtn: "← العودة للقائمة", catalogTitle: "مكتبة الألعاب",
      headingTrailer: "الإعلان الرسمي (التريلر)", headingDesc: "شرح اللعبة",
      headingDownload: "رابط التحميل", megaBtn: "تحميل اللعبة من MEGA",
      headingReqs: "متطلبات تشغيل اللعبة", thSpec: "المواصفات", thMin: "الحد الأدنى",
      thRec: "الموصى به", rowOs: "نظام التشغيل", rowCpu: "المعالج", rowRam: "الذاكرة (RAM)",
      rowGpu: "كرت الشاشة", rowStorage: "المساحة المطلوبة"
    },
    en: {
      langBtn: "العربية", backBtn: "← Back to List", catalogTitle: "Games Catalog",
      headingTrailer: "Official Trailer", headingDesc: "Game Overview",
      headingDownload: "Download Link", megaBtn: "Download via MEGA",
      headingReqs: "System Requirements", thSpec: "Spec", thMin: "Minimum",
      thRec: "Recommended", rowOs: "OS", rowCpu: "Processor", rowRam: "RAM",
      rowGpu: "Graphics", rowStorage: "Storage"
    }
  };

  // عرض بطاقات الألعاب
  function renderCatalog() {
    const container = document.getElementById('grid-container');
    container.innerHTML = '';
    
    gamesData.forEach(game => {
      const card = document.createElement('div');
      card.className = 'game-card';
      card.onclick = () => openGame(game.id);
      card.innerHTML = `
        <img src="${game.cover}" alt="${game.title[currentLang]}">
        <h3>${game.title[currentLang]}</h3>
      `;
      container.appendChild(card);
    });
  }

  // فتح صفحة اللعبة
  function openGame(gameId) {
    activeGameId = gameId;
    const game = gamesData.find(g => g.id === gameId);
    
    document.getElementById('games-catalog').style.display = 'none';
    document.getElementById('game-details').style.display = 'block';
    document.getElementById('back-btn').style.display = 'inline-block';

    document.getElementById('detail-title').textContent = game.title[currentLang];
    document.getElementById('detail-desc').textContent = game.desc[currentLang];
    document.getElementById('detail-mega').href = game.megaUrl;
    document.getElementById('detail-trailer').src = `https://www.youtube.com/embed/${game.youtubeId}`;

    // ملء متطلبات التشغيل
    document.getElementById('min-os').textContent = game.reqs.min.os;
    document.getElementById('min-cpu').textContent = game.reqs.min.cpu;
    document.getElementById('min-ram').textContent = game.reqs.min.ram;
    document.getElementById('min-gpu').textContent = game.reqs.min.gpu;
    document.getElementById('min-storage').textContent = game.reqs.min.storage;

    document.getElementById('rec-os').textContent = game.reqs.rec.os;
    document.getElementById('rec-cpu').textContent = game.reqs.rec.cpu;
    document.getElementById('rec-ram').textContent = game.reqs.rec.ram;
    document.getElementById('rec-gpu').textContent = game.reqs.rec.gpu;
    document.getElementById('rec-storage').textContent = game.reqs.rec.storage;
  }

  // العودة إلى قائمة الألعاب
  function showCatalog() {
    activeGameId = null;
    document.getElementById('games-catalog').style.display = 'block';
    document.getElementById('game-details').style.display = 'none';
    document.getElementById('back-btn').style.display = 'none';
    document.getElementById('detail-trailer').src = ''; // إيقاف الفيديو عند الخروج
  }

  // تحويل اللغة
  function toggleLanguage() {
    currentLang = currentLang === 'ar' ? 'en' : 'ar';
    document.documentElement.lang = currentLang;
    document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';

    const text = UI_TEXT[currentLang];
    
    document.getElementById('lang-btn').textContent = text.langBtn;
    document.getElementById('back-btn').textContent = text.backBtn;
    document.getElementById('catalog-title').textContent = text.catalogTitle;
    document.getElementById('heading-trailer').textContent = text.headingTrailer;
    document.getElementById('heading-desc').textContent = text.headingDesc;
    document.getElementById('heading-download').textContent = text.headingDownload;
    document.getElementById('detail-mega').textContent = text.megaBtn;
    document.getElementById('heading-reqs').textContent = text.headingReqs;
    document.getElementById('th-spec').textContent = text.thSpec;
    document.getElementById('th-min').textContent = text.thMin;
    document.getElementById('th-rec').textContent = text.thRec;
    document.getElementById('row-os').textContent = text.rowOs;
    document.getElementById('row-cpu').textContent = text.rowCpu;
    document.getElementById('row-ram').textContent = text.rowRam;
    document.getElementById('row-gpu').textContent = text.rowGpu;
    document.getElementById('row-storage').textContent = text.rowStorage;

    renderCatalog();
    if (activeGameId) openGame(activeGameId);
  }

  // التشغيل الأولي
  renderCatalog();
</script>

</body>
</html>
